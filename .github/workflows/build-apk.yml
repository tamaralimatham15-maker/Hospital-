name: Build CareFlow APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          p = next((x for x in candidates if x.exists()), None)
          if p is None:
              raise SystemExit("Android app Gradle file was not generated")
          s = p.read_text()
          kotlin = p.name.endswith(".kts")
          if "isCoreLibraryDesugaringEnabled" not in s and "coreLibraryDesugaringEnabled" not in s:
              compile_block = ("    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n" if kotlin else "    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }\n")
              if "compileOptions {" in s:
                  s = s.replace("compileOptions {", "compileOptions {\n        " + ("isCoreLibraryDesugaringEnabled = true" if kotlin else "coreLibraryDesugaringEnabled true"), 1)
              elif "android {" in s:
                  s = s.replace("android {", "android {\n" + compile_block, 1)
              else:
                  raise SystemExit("Could not find android block in Gradle file")
          dep = ('dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' if kotlin else 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n')
          if "desugar_jdk_libs" not in s:
              s += "\n" + dep
          p.write_text(s)
          print(f"Configured core library desugaring in {p}")
          PY
      - name: Configure Android notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '    <application'
          permissions = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          '''
          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace(marker, permissions + marker, 1)
          receivers = '''\n              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n                  <intent-filter>\n                      <action android:name="android.intent.action.BOOT_COMPLETED" />\n                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n                  </intent-filter>\n              </receiver>\n          '''
          if "ScheduledNotificationBootReceiver" not in s:
              s = s.replace("    </application>", receivers + "    </application>", 1)
          p.write_text(s)
          PY
      - name: Set ENAYA Android app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, count = re.subn(r'android:label="[^"]+"', 'android:label="عناية"', s, count=1)
          if count != 1:
              raise SystemExit("Could not set Android app label")
          p.write_text(s)
          PY
      - run: flutter pub get
      - name: Analyze Flutter project (non-blocking)
        run: flutter analyze || true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: careflow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
