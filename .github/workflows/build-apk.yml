name: Build CareFlow APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - name: Configure Android notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '    <application'
          permissions = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          '''
          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace(marker, permissions + marker, 1)
              p.write_text(s)
          PY
      - run: flutter pub get
      - name: Analyze Flutter project (non-blocking)
        run: flutter analyze || true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: careflow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
